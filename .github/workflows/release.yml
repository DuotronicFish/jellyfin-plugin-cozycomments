# Builds the plugin on every push / pull request. On a tag "v<version>" it also publishes a GitHub release
# with the zip and adds that version to manifest.json on the default branch (the plugin repository URL).
# This version of the workflow builds the Jellyfin 12.x plugin (2.x, targetAbi 12.0.0.0). Older manifest entries
# (1.2.x for Jellyfin 10.11) are kept: update_manifest.py only adds/replaces the version being released.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: dist/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/Jellyfin.Plugin.CozyComments/Jellyfin.Plugin.CozyComments.csproj | head -1)
          TAG="${GITHUB_REF_NAME}"
          if [ "v$VERSION" != "$TAG" ]; then echo "Tag $TAG does not match csproj version $VERSION"; exit 1; fi
          ZIP="cozycomments_${VERSION}.zip"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}"
          gh release create "$TAG" "dist/$ZIP" --title "Cozy Comments $VERSION (Jellyfin 12.x)" --latest --notes "See [CHANGELOG.md](CHANGELOG.md)." || \
            gh release upload "$TAG" "dist/$ZIP" --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "${{ github.event.repository.default_branch }}"
          python3 scripts/update_manifest.py --manifest manifest.json --version "$VERSION" --url "$URL" \
            --checksum "$(md5sum "dist/$ZIP" | cut -d' ' -f1)" --abi 12.0.0.0 \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --changelog "See CHANGELOG.md for ${VERSION}"
          git add manifest.json
          git commit -m "manifest: add ${VERSION}" || echo "manifest unchanged"
          git push origin HEAD
